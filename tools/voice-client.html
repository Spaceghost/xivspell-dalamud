<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimoire · Voice</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#080d18;color:#d6f4ff}body{max-width:600px;margin:10vh auto;padding:28px}h1{font-weight:300;letter-spacing:.25em;color:#efd395}p{line-height:1.6;color:#9cbbcc}.orb{width:128px;height:128px;border:1px solid #e6c384;border-radius:50%;margin:36px auto;display:grid;place-items:center;font-size:38px;box-shadow:0 0 45px #69d5ff25}.recording .orb{animation:pulse 1s infinite alternate;box-shadow:0 0 70px #69d5ff66}button,select{font:inherit;background:#132236;color:#e2f5ff;border:1px solid #58788e;padding:13px;border-radius:12px;margin:6px}button{cursor:pointer}#words{min-height:70px;color:#fff;font-size:1.2rem}#status{color:#efd395}small{color:#92a7ba}@keyframes pulse{to{transform:scale(1.08)}}
</style>
<h1>G R I M O I R E</h1><p>Your voice, woven into spells.</p><div class="orb">◇</div>
<label>Microphone <select id="devices"><option value="">Controller / headset default</option></select></label>
<div><button id="enable">Enable microphone</button><button id="talk" disabled>Speak a spell</button><button id="cancel">Cancel</button></div>
<p id="status">Enable your streaming client’s microphone once, then use △ / Y in Grimoire.</p><p id="words"></p>
<small>Speak a spell or input. Review it in-game, then Enter / A to weave. Audio is transcribed on your game host.</small>
<script>
'use strict';
let enabled=false,stream=null,context=null,source=null,processor=null,silent=null,chunks=[],recording=0,stopping=false,timeout=null,clientGeneration=0,busy=false;
const $=id=>document.getElementById(id);
async function api(path,options={}){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Connection failed');return data;}
async function stopCapture(upload){if(!recording||stopping)return;stopping=true;const generation=recording;recording=0;clearTimeout(timeout);document.body.classList.remove('recording');$('talk').textContent='Speak a spell';if(processor){processor.disconnect();source.disconnect();silent.disconnect();processor.onaudioprocess=null;}if(stream)stream.getTracks().forEach(t=>t.stop());if(context)await context.close();if(upload){$('status').textContent='Transcribing…';const count=chunks.reduce((n,c)=>n+c.length,0), buffer=new ArrayBuffer(44+count*2),view=new DataView(buffer);const str=(offset,s)=>[...s].forEach((c,i)=>view.setUint8(offset+i,c.charCodeAt(0)));str(0,'RIFF');view.setUint32(4,36+count*2,true);str(8,'WAVE');str(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);str(36,'data');view.setUint32(40,count*2,true);let at=44;for(const chunk of chunks)for(const sample of chunk){view.setInt16(at,Math.max(-1,Math.min(1,sample))*32767,true);at+=2;}try{const result=await api('/api/audio',{method:'POST',headers:{'Content-Type':'audio/wav','X-Grimoire-Generation':String(generation)},body:buffer});$('words').textContent=result.text;$('status').textContent=result.discarded?'Session changed; speech discarded.':'Ready in Grimoire · Enter / A to weave';}catch(error){$('status').textContent=error.message;}}chunks=[];stopping=false;}
async function begin(generation){if(!enabled||recording||stopping)return;clientGeneration=generation;stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('devices').value?{exact:$('devices').value}:undefined,channelCount:1,echoCancellation:true,noiseSuppression:true}});context=new AudioContext({sampleRate:16000});if(context.sampleRate!==16000){stream.getTracks().forEach(t=>t.stop());await context.close();throw Error('This browser cannot record at 16 kHz; try another browser.');}source=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(2048,1,1);silent=context.createGain();silent.gain.value=0;source.connect(processor);processor.connect(silent);silent.connect(context.destination);chunks=[];processor.onaudioprocess=event=>{if(recording)chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));};recording=generation;document.body.classList.add('recording');$('status').textContent='Listening · press △ / Y again to finish';$('talk').textContent='Finish speaking';timeout=setTimeout(async()=>{await api('/api/stop',{method:'POST'});await stopCapture(true);},29000);}
$('enable').onclick=async()=>{try{const permission=await navigator.mediaDevices.getUserMedia({audio:true});permission.getTracks().forEach(t=>t.stop());const devices=await navigator.mediaDevices.enumerateDevices();$('devices').replaceChildren(new Option('Controller / headset default',''));devices.filter(d=>d.kind==='audioinput').forEach(d=>$('devices').add(new Option(d.label||'Microphone',d.deviceId)));enabled=true;$('talk').disabled=false;$('enable').textContent='Microphone enabled';$('status').textContent='Ready · use △ / Y in-game or Speak a spell';}catch(error){$('status').textContent=error.message;}};
$('talk').onclick=async()=>{try{if(recording){await api('/api/stop',{method:'POST'});await stopCapture(true);}else{const state=await api('/api/start',{method:'POST'});await begin(state.generation);}}catch(error){$('status').textContent=error.message;}};
$('cancel').onclick=async()=>{await api('/api/cancel',{method:'POST'});await stopCapture(false);$('status').textContent='Cancelled';};
async function poll(){if(busy)return;busy=true;try{const state=await api('/api/state');if(recording&&state.generation!==recording)await stopCapture(false);if(enabled&&state.phase==='listening'&&state.generation!==clientGeneration)await begin(state.generation);else if(recording&&state.phase==='transcribing')await stopCapture(true);else if(recording&&state.phase==='idle')await stopCapture(false);}catch(error){$('status').textContent=error.message;}finally{busy=false;}}setInterval(poll,250);
</script></html>
